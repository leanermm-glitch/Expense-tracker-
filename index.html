<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Money Tracker</title>
    <!-- PWA Links -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { brand: { light: '#10b981', dark: '#059669' }, danger: { light: '#ef4444', dark: '#dc2626' } } }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brand-light dark:bg-brand-dark text-white p-4 shadow-md rounded-b-3xl shrink-0">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Money Tracker</h1>
            <div class="flex items-center gap-2">
                <select id="currencySelector" class="bg-white/20 text-white border-none rounded p-1.5 outline-none text-sm cursor-pointer font-medium">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="SAR">SAR (ر.س)</option>
                    <option value="INR">INR (₹)</option>
                </select>
                <button id="themeToggle" class="p-2 bg-white/20 rounded-full hover:bg-white/30 transition">
                    <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>

        <div class="mb-4">
            <select id="dateFilter" class="w-full bg-white/20 text-white border-none rounded-lg p-2 outline-none text-sm cursor-pointer font-medium mb-2">
                <option value="all" class="text-gray-800">All Time</option>
                <option value="month" class="text-gray-800">This Month</option>
                <option value="year" class="text-gray-800">This Year</option>
            </select>
        </div>
        
        <div class="grid grid-cols-3 gap-2 text-center text-sm mb-1">
            <div>
                <p class="opacity-80 text-xs uppercase tracking-wider">Spendings</p>
                <p id="totalExpense" class="font-bold text-lg text-red-200">0.00</p>
            </div>
            <div class="border-x border-white/30">
                <p class="opacity-80 text-xs uppercase tracking-wider">Available</p>
                <p id="totalBalance" class="font-bold text-xl">0.00</p>
            </div>
            <div>
                <p class="opacity-80 text-xs uppercase tracking-wider">Initial</p>
                <p id="totalIncome" class="font-bold text-lg text-green-200">0.00</p>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 relative pb-24">
        
        <!-- Records View -->
        <div id="recordsView" class="view-section block">
            <div class="mb-4">
                <input type="text" id="searchTx" placeholder="Search notes or categories..." class="w-full bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 p-3 rounded-xl shadow-sm outline-none text-sm border border-gray-100 dark:border-gray-700">
            </div>
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Transactions</h2>
            <div id="transactionList" class="space-y-3"></div>
            <p id="emptyState" class="text-center text-gray-400 mt-10 hidden">No transactions found.</p>
        </div>

        <!-- Chart View -->
        <div id="chartView" class="view-section hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm mb-6">
                <canvas id="expenseChart"></canvas>
            </div>
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Spending Trends</h2>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm mb-6"><canvas id="trendChart"></canvas></div>
        </div>

        <!-- Budgets View -->
        <div id="budgetsView" class="view-section hidden">
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Monthly Budgets</h2>
            <p class="text-xs text-gray-400 mb-4">Set limits for your spending. Tap a number to edit.</p>
            <div id="budgetList" class="space-y-4"></div>
        </div>

        <!-- Reports View -->
        <div id="reportsView" class="view-section hidden">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-4 border-b border-gray-100 dark:border-gray-700">
                    <h2 class="font-bold text-lg">Data Management</h2>
                    <p class="text-xs text-gray-500 mt-1">Export or restore your data</p>
                </div>
                <button onclick="exportJSON()" class="w-full text-left p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-700">
                    <div class="p-2 bg-brand-light/20 text-brand-dark rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></div>
                    <div><p class="font-medium">Backup Data (JSON)</p><p class="text-xs text-gray-400">Save full backup file</p></div>
                </button>
                <label class="w-full text-left p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer">
                    <div class="p-2 bg-purple-100 text-purple-600 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg></div>
                    <div><p class="font-medium">Restore Data</p><p class="text-xs text-gray-400">Upload a previous JSON backup</p></div>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
            </div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button onclick="openModal()" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-brand-light dark:bg-brand-dark text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform z-10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 flex justify-around p-3 pb-safe fixed bottom-0 w-full z-0">
        <button onclick="switchTab('records')" class="nav-btn active flex flex-col items-center text-brand-light dark:text-brand-dark">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            <span class="text-[10px] mt-1">Records</span>
        </button>
        <button onclick="switchTab('chart')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-light dark:hover:text-brand-dark transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
            <span class="text-[10px] mt-1">Chart</span>
        </button>
        <button onclick="switchTab('budgets')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-light dark:hover:text-brand-dark transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            <span class="text-[10px] mt-1">Budgets</span>
        </button>
        <button onclick="switchTab('reports')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-light dark:hover:text-brand-dark transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-[10px] mt-1">Settings</span>
        </button>
    </nav>

    <!-- Add Transaction Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end justify-center">
        <div class="bg-white dark:bg-gray-800 w-full rounded-t-3xl p-5 transform transition-transform translate-y-full max-h-[90vh] overflow-y-auto" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Add Record</h3>
                <button onclick="closeModal()" class="p-1 bg-gray-100 dark:bg-gray-700 rounded-full"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex gap-2 mb-4 bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                <button onclick="setTxType('expense')" id="btnTypeExpense" class="flex-1 py-1.5 rounded bg-danger-light text-white shadow-sm text-sm font-medium">Spendings</button>
                <button onclick="setTxType('income')" id="btnTypeIncome" class="flex-1 py-1.5 rounded text-gray-500 dark:text-gray-400 text-sm font-medium">Initial</button>
            </div>

            <form id="txForm" onsubmit="saveTransaction(event)">
                <div class="mb-4 flex gap-3">
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 mb-1 block">Currency</label>
                        <select id="modalCurrency" class="w-full text-xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="SAR">SAR (ر.س)</option>
                            <option value="INR">INR (₹)</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 mb-1 block">Date</label>
                        <input type="date" id="txDate" required class="w-full text-base font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-gray-800 dark:text-white">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-500 mb-1 block">Amount</label>
                    <input type="number" id="txAmount" required step="0.01" placeholder="0.00" class="w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-danger-light">
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-500 mb-2 block">Category</label>
                    <div id="categoryGrid" class="grid grid-cols-4 gap-3"></div>
                </div>

                <div class="mb-4 hidden" id="recurringWrapper">
                    <label class="flex items-center gap-2 cursor-pointer bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border border-gray-200 dark:border-gray-600">
                        <input type="checkbox" id="txRecurring" class="w-5 h-5 rounded text-danger-light focus:ring-danger-light">
                        <span class="text-sm font-medium">Repeat this automatically every month</span>
                    </label>
                </div>

                <div class="mb-6">
                    <label class="text-xs text-gray-500 mb-1 block">Note (Optional)</label>
                    <input type="text" id="txNote" placeholder="What was this for?" class="w-full bg-gray-50 dark:bg-gray-700 p-3 rounded-lg outline-none text-sm border border-gray-200 dark:border-gray-600">
                </div>

                <input type="hidden" id="txCategory" required>
                <button id="saveBtn" type="submit" class="w-full bg-danger-light text-white font-bold py-3 rounded-xl">Save</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-sm"></div>

    <script>
        // PWA Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        }

        let transactions = JSON.parse(localStorage.getItem('moneyTrackerTx')) || [];
        let budgets = JSON.parse(localStorage.getItem('moneyTrackerBudgets')) || {};
        let recurring = JSON.parse(localStorage.getItem('moneyTrackerRecurring')) || [];
        
        let currentType = 'expense';
        let currentCurrency = localStorage.getItem('selectedCurrency') || 'USD';
        let filterMode = localStorage.getItem('dateFilterMode') || 'month';
        let myChart = null;
        let myTrendChart = null;

        const currencySymbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'SAR': 'ر.س', 'INR': '₹' };
        
        const expenseCategories = [
            { id: 'food', icon: '🍔', name: 'Food' }, { id: 'shop', icon: '🛍️', name: 'Shopping' },
            { id: 'transport', icon: '🚗', name: 'Transport' }, { id: 'home', icon: '🏠', name: 'Home' },
            { id: 'bills', icon: '📱', name: 'Bills' }, { id: 'entertainment', icon: '🎬', name: 'Fun' },
            { id: 'health', icon: '⚕️', name: 'Health' }, { id: 'other', icon: '📦', name: 'Other' }
        ];

        const incomeCategories = [
            { id: 'salary', icon: '💰', name: 'Salary' }, { id: 'freelance', icon: '💻', name: 'Freelance' },
            { id: 'gift', icon: '🎁', name: 'Gift' }, { id: 'invest', icon: '📈', name: 'Returns' }
        ];

        // Process Recurring Transactions
        function processRecurring() {
            const today = new Date();
            let addedNew = false;
            
            recurring.forEach(rec => {
                let nextDate = new Date(rec.nextDate);
                while (nextDate <= today) {
                    transactions.push({
                        id: Date.now() + Math.random(),
                        type: 'expense',
                        amount: rec.amount,
                        category: rec.category,
                        currency: rec.currency,
                        date: nextDate.toISOString().split('T')[0],
                        note: rec.note + ' (Auto-recurring)'
                    });
                    // Add 1 month to nextDate
                    nextDate.setMonth(nextDate.getMonth() + 1);
                    rec.nextDate = nextDate.toISOString().split('T')[0];
                    addedNew = true;
                }
            });

            if (addedNew) {
                localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
                localStorage.setItem('moneyTrackerRecurring', JSON.stringify(recurring));
            }
        }

        // Init Setup
        processRecurring();
        document.getElementById('currencySelector').value = currentCurrency;
        document.getElementById('dateFilter').value = filterMode;

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('sunIcon').classList.remove('hidden');
            document.getElementById('moonIcon').classList.add('hidden');
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            document.getElementById('sunIcon').classList.toggle('hidden');
            document.getElementById('moonIcon').classList.toggle('hidden');
            if (myChart) updateUI();
        });

        document.getElementById('currencySelector').addEventListener('change', (e) => {
            currentCurrency = e.target.value;
            localStorage.setItem('selectedCurrency', currentCurrency);
            updateUI();
        });

        document.getElementById('dateFilter').addEventListener('change', (e) => {
            filterMode = e.target.value;
            localStorage.setItem('dateFilterMode', filterMode);
            updateUI();
        });

        document.getElementById('searchTx').addEventListener('input', updateUI);

        const formatMoney = (amount) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);

        function getFilteredTransactions() {
            const now = new Date();
            const searchVal = document.getElementById('searchTx').value.toLowerCase();
            
            return transactions.filter(t => {
                if (t.currency !== currentCurrency) return false;

                const txDate = new Date(t.date || t.id);
                
                if (filterMode === 'month') {
                    if (txDate.getMonth() !== now.getMonth() || txDate.getFullYear() !== now.getFullYear()) return false;
                } else if (filterMode === 'year') {
                    if (txDate.getFullYear() !== now.getFullYear()) return false;
                }

                if (searchVal) {
                    const catName = [...expenseCategories, ...incomeCategories].find(c => c.id === t.category)?.name.toLowerCase() || '';
                    const note = (t.note || '').toLowerCase();
                    if (!catName.includes(searchVal) && !note.includes(searchVal)) return false;
                }
                return true;
            });
        }

        function updateUI() {
            const filteredTx = getFilteredTransactions();
            
            let expenses = 0, income = 0;
            filteredTx.forEach(t => {
                if (t.type === 'expense') expenses += t.amount;
                else income += t.amount;
            });

            const sym = currencySymbols[currentCurrency];
            document.getElementById('totalExpense').innerText = `${sym}${formatMoney(expenses)}`;
            document.getElementById('totalIncome').innerText = `${sym}${formatMoney(income)}`;
            document.getElementById('totalBalance').innerText = `${sym}${formatMoney(income - expenses)}`;

            renderTransactionList(filteredTx, sym);
            updateChart(filteredTx, sym);
            renderBudgets(sym);
        }

        function renderTransactionList(filteredTx, sym) {
            const list = document.getElementById('transactionList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (filteredTx.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredTx.sort((a, b) => new Date(b.date || b.id) - new Date(a.date || a.id)).forEach(tx => {
                    const cat = [...expenseCategories, ...incomeCategories].find(c => c.id === tx.category) || { icon: '📝', name: 'Unknown' };
                    const isExp = tx.type === 'expense';
                    const displayDate = new Date(tx.date || tx.id).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const noteHtml = tx.note ? `<p class="text-xs text-gray-400 truncate max-w-[150px]">${tx.note}</p>` : '';

                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border-l-4 ${isExp ? 'border-danger-light' : 'border-brand-light'}">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gray-50 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl">${cat.icon}</div>
                                <div>
                                    <p class="font-medium text-sm">${cat.name}</p>
                                    <div class="flex items-center gap-2"><p class="text-xs text-gray-400">${displayDate}</p>${noteHtml}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-bold ${isExp ? 'text-danger-light dark:text-danger-dark' : 'text-brand-light dark:text-brand-dark'}">
                                    ${isExp ? '-' : '+'}${sym}${formatMoney(tx.amount)}
                                </p>
                                <button onclick="deleteTx(${tx.id})" class="text-xs text-gray-400 hover:text-danger-light mt-1">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // --- BUDGTES LOGIC ---
        function renderBudgets(sym) {
            const list = document.getElementById('budgetList');
            list.innerHTML = '';
            
            // Calculate current month spending per category
            const now = new Date();
            const currentMonthTx = transactions.filter(t => {
                const d = new Date(t.date || t.id);
                return t.currency === currentCurrency && t.type === 'expense' && 
                       d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });

            let spentPerCat = {};
            currentMonthTx.forEach(t => { spentPerCat[t.category] = (spentPerCat[t.category] || 0) + t.amount; });

            expenseCategories.forEach(cat => {
                const limit = budgets[`${currentCurrency}_${cat.id}`] || 0;
                const spent = spentPerCat[cat.id] || 0;
                const percent = limit > 0 ? Math.min((spent / limit) * 100, 100) : 0;
                
                const barColor = percent >= 100 ? 'bg-danger-light' : (percent >= 80 ? 'bg-orange-400' : 'bg-brand-light');

                list.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-2">
                                <span>${cat.icon}</span><span class="font-medium text-sm">${cat.name}</span>
                            </div>
                            <div class="text-right cursor-pointer" onclick="setBudget('${cat.id}', ${limit})">
                                <p class="text-xs text-gray-500">Spent ${sym}${formatMoney(spent)} of</p>
                                <p class="text-sm font-bold text-brand-light dark:text-brand-dark hover:underline">${sym}${formatMoney(limit)} limit</p>
                            </div>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2">
                            <div class="${barColor} h-2 rounded-full transition-all" style="width: ${limit > 0 ? percent : 0}%"></div>
                        </div>
                    </div>
                `;
            });
        }

        function setBudget(catId, currentLimit) {
            const promptStr = `Enter new monthly limit for this category in ${currentCurrency}:`;
            const limit = prompt(promptStr, currentLimit);
            if (limit !== null && !isNaN(limit) && limit >= 0) {
                budgets[`${currentCurrency}_${catId}`] = parseFloat(limit);
                localStorage.setItem('moneyTrackerBudgets', JSON.stringify(budgets));
                updateUI();
            }
        }

        function updateChart(filteredTx, sym) {
            const expenseTx = filteredTx.filter(t => t.type === 'expense');
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#9ca3af' : '#6b7280';

            let catData = {}, dateData = {};
            expenseTx.forEach(t => {
                const catName = expenseCategories.find(c => c.id === t.category)?.name || 'Other';
                catData[catName] = (catData[catName] || 0) + t.amount;
                const d = t.date || new Date(t.id).toISOString().split('T')[0];
                dateData[d] = (dateData[d] || 0) + t.amount;
            });

            const ctxDonut = document.getElementById('expenseChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData),
                    datasets: [{
                        data: Object.values(catData),
                        backgroundColor: ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899'],
                        borderWidth: isDark ? 2 : 0, borderColor: isDark ? '#1f2937' : '#ffffff'
                    }]
                },
                options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'right', labels: { color: textColor, font: { size: 11 } } } } }
            });

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            const sortedDates = Object.keys(dateData).sort();
            if (myTrendChart) myTrendChart.destroy();
            myTrendChart = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: sortedDates.map(d => new Date(d).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})),
                    datasets: [{
                        label: 'Spendings', data: sortedDates.map(d => dateData[d]),
                        borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId + 'View').classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-light', 'dark:text-brand-dark');
                btn.classList.add('text-gray-400');
            });
            event.currentTarget.classList.remove('text-gray-400');
            event.currentTarget.classList.add('text-brand-light', 'dark:text-brand-dark');
            if(tabId === 'chart' || tabId === 'budgets') updateUI();
        }

        function openModal() {
            document.getElementById('addModal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modalContent').classList.remove('translate-y-full'); }, 10);
            
            document.getElementById('modalCurrency').value = currentCurrency;
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            setTxType('expense');
            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
            document.getElementById('txRecurring').checked = false;
        }

        function closeModal() {
            document.getElementById('modalContent').classList.add('translate-y-full');
            setTimeout(() => { document.getElementById('addModal').classList.add('hidden'); }, 300);
        }

        function setTxType(type) {
            currentType = type;
            const btnExp = document.getElementById('btnTypeExpense');
            const btnInc = document.getElementById('btnTypeIncome');
            const recWrap = document.getElementById('recurringWrapper');
            
            if (type === 'expense') {
                btnExp.className = 'flex-1 py-1.5 rounded bg-danger-light text-white shadow-sm text-sm font-medium';
                btnInc.className = 'flex-1 py-1.5 rounded text-gray-500 text-sm font-medium hover:bg-gray-100';
                document.getElementById('saveBtn').className = 'w-full bg-danger-light text-white font-bold py-3 rounded-xl transition';
                document.getElementById('txAmount').className = 'w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-danger-light';
                recWrap.classList.remove('hidden');
                renderCategories(expenseCategories);
            } else {
                btnInc.className = 'flex-1 py-1.5 rounded bg-brand-light text-white shadow-sm text-sm font-medium';
                btnExp.className = 'flex-1 py-1.5 rounded text-gray-500 text-sm font-medium hover:bg-gray-100';
                document.getElementById('saveBtn').className = 'w-full bg-brand-light text-white font-bold py-3 rounded-xl transition';
                document.getElementById('txAmount').className = 'w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-brand-light';
                recWrap.classList.add('hidden');
                renderCategories(incomeCategories);
            }
        }

        function renderCategories(cats) {
            document.getElementById('categoryGrid').innerHTML = cats.map(c => `
                <div onclick="selectCategory('${c.id}', this)" class="cat-item flex flex-col items-center gap-1 p-2 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <div class="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl">${c.icon}</div>
                    <span class="text-[10px] text-gray-500">${c.name}</span>
                </div>
            `).join('');
            document.getElementById('txCategory').value = '';
        }

        function selectCategory(id, el) {
            const activeColor = currentType === 'expense' ? 'bg-danger-light ring-danger-light' : 'bg-brand-light ring-brand-light';
            document.querySelectorAll('.cat-item div').forEach(d => d.className = 'w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl');
            el.querySelector('div').className = `w-10 h-10 ${activeColor} text-white rounded-full flex items-center justify-center text-xl ring-2 ring-offset-2 dark:ring-offset-gray-800`;
            document.getElementById('txCategory').value = id;
        }

        function saveTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;
            const modalCurr = document.getElementById('modalCurrency').value;
            const txDate = document.getElementById('txDate').value;
            const note = document.getElementById('txNote').value.trim();
            const isRecurring = document.getElementById('txRecurring').checked;

            if (!amount || !category || !txDate) return showToast("Complete all required fields");

            const tx = { id: Date.now(), type: currentType, amount, category, currency: modalCurr, date: txDate, note };
            transactions.push(tx);
            localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));

            if (currentType === 'expense' && isRecurring) {
                let nextD = new Date(txDate);
                nextD.setMonth(nextD.getMonth() + 1);
                recurring.push({ amount, category, currency: modalCurr, note, nextDate: nextD.toISOString().split('T')[0] });
                localStorage.setItem('moneyTrackerRecurring', JSON.stringify(recurring));
            }
            
            if(modalCurr !== currentCurrency) {
                document.getElementById('currencySelector').value = currentCurrency = modalCurr;
                localStorage.setItem('selectedCurrency', modalCurr);
            }
            showToast("Record saved!");
            closeModal();
            updateUI();
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
            updateUI();
            showToast("Record deleted");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        async function exportJSON() {
            const dataObj = { transactions, budgets, recurring };
            const jsonStr = JSON.stringify(dataObj, null, 2);
            const fileName = `MoneyTracker_Backup_${new Date().toLocaleDateString('en-US').replace(/\//g, '-')}.json`;
            
            // Step 1: Try using the native iOS Share Sheet (perfect for Home Screen apps)
            if (navigator.share) {
                try {
                    const file = new File([jsonStr], fileName, { type: 'application/json' });
                    // Check if the device supports sharing files
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'Money Tracker Backup',
                            files: [file]
                        });
                        return; // Stop here if share was successful
                    }
                } catch (err) {
                    console.log("Share sheet cancelled or failed:", err);
                    // If it fails (like user hits cancel), we just silently exit or fall through
                }
            }

            // Step 2: Fallback for laptops/desktop browsers
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonStr);
            const dl = document.createElement('a');
            dl.href = dataStr;
            dl.download = fileName;
            document.body.appendChild(dl);
            dl.click();
            document.body.removeChild(dl);
        }

        function importJSON(event) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imp = JSON.parse(e.target.result);
                    if(imp.transactions) {
                        transactions = imp.transactions; budgets = imp.budgets || {}; recurring = imp.recurring || [];
                        localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
                        localStorage.setItem('moneyTrackerBudgets', JSON.stringify(budgets));
                        localStorage.setItem('moneyTrackerRecurring', JSON.stringify(recurring));
                        updateUI(); showToast("Data restored!");
                    } else if (Array.isArray(imp)) { // Legacy support
                        transactions = imp; localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
                        updateUI(); showToast("Legacy Data restored!");
                    }
                } catch (err) { showToast("Error restoring data"); }
            };
            if(event.target.files[0]) reader.readAsText(event.target.files[0]);
        }

        updateUI();
    </script>
</body>
</html>
