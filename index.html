<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#10b981', dark: '#059669' },
                        danger: { light: '#ef4444', dark: '#dc2626' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-brand-light dark:bg-brand-dark text-white p-4 shadow-md rounded-b-3xl shrink-0">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Money Tracker</h1>
            <div class="flex items-center gap-2">
                <select id="currencySelector" class="bg-white/20 text-white border-none rounded p-1.5 outline-none text-sm cursor-pointer font-medium">
                    <option value="USD" class="text-gray-800">USD ($)</option>
                    <option value="EUR" class="text-gray-800">EUR (€)</option>
                    <option value="GBP" class="text-gray-800">GBP (£)</option>
                    <option value="SAR" class="text-gray-800">SAR (ر.س)</option>
                    <option value="INR" class="text-gray-800">INR (₹)</option>
                </select>
                <button id="themeToggle" class="p-2 bg-white/20 rounded-full hover:bg-white/30 transition">
                    <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Global Filters -->
        <div class="mb-4">
            <select id="dateFilter" class="w-full bg-white/20 text-white border-none rounded-lg p-2 outline-none text-sm cursor-pointer font-medium mb-2">
                <option value="all" class="text-gray-800">All Time</option>
                <option value="week" class="text-gray-800">Last 7 Days</option>
                <option value="month" class="text-gray-800">Last 30 Days</option>
                <option value="year" class="text-gray-800">Last 1 Year</option>
                <option value="custom" class="text-gray-800">Custom Date Range</option>
            </select>
            <div id="customDateContainer" class="hidden flex gap-2">
                <input type="date" id="filterStartDate" class="flex-1 bg-white/20 text-white border-none rounded p-1.5 outline-none text-xs">
                <input type="date" id="filterEndDate" class="flex-1 bg-white/20 text-white border-none rounded p-1.5 outline-none text-xs">
            </div>
        </div>
        
        <div class="grid grid-cols-3 gap-2 text-center text-sm mb-1">
            <div>
                <p class="opacity-80 text-xs uppercase tracking-wider">Spendings</p>
                <p id="totalExpense" class="font-bold text-lg text-red-200">0.00</p>
            </div>
            <div class="border-x border-white/30">
                <p class="opacity-80 text-xs uppercase tracking-wider">Available</p>
                <p id="totalBalance" class="font-bold text-xl">0.00</p>
            </div>
            <div>
                <p class="opacity-80 text-xs uppercase tracking-wider">Initial</p>
                <p id="totalIncome" class="font-bold text-lg text-green-200">0.00</p>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 relative">
        <!-- Records View -->
        <div id="recordsView" class="view-section block pb-20">
            <div class="mb-4">
                <input type="text" id="searchTx" placeholder="Search notes or categories..." class="w-full bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 p-3 rounded-xl shadow-sm outline-none text-sm border border-gray-100 dark:border-gray-700">
            </div>
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Transactions</h2>
            <div id="transactionList" class="space-y-3"></div>
            <p id="emptyState" class="text-center text-gray-400 mt-10 hidden">No transactions found.</p>
        </div>

        <!-- Chart View -->
        <div id="chartView" class="view-section hidden pb-20">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm mb-6">
                <canvas id="expenseChart"></canvas>
            </div>
            
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Spending Trends</h2>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm mb-6">
                <canvas id="trendChart"></canvas>
            </div>

            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">Top Spendings</h2>
            <div id="topExpensesList" class="space-y-4 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm"></div>
        </div>

        <!-- Reports View -->
        <div id="reportsView" class="view-section hidden pb-20">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-4 border-b border-gray-100 dark:border-gray-700">
                    <h2 class="font-bold text-lg">Data Management</h2>
                    <p class="text-xs text-gray-500 mt-1">Export or restore your data</p>
                </div>
                <button onclick="exportCSV()" class="w-full text-left p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-700">
                    <div class="p-2 bg-blue-100 text-blue-600 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <div><p class="font-medium">Export to CSV</p><p class="text-xs text-gray-400">Download for Excel/Spreadsheets</p></div>
                </button>
                <button onclick="exportJSON()" class="w-full text-left p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-700">
                    <div class="p-2 bg-brand-light/20 text-brand-dark rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></div>
                    <div><p class="font-medium">Backup Data (JSON)</p><p class="text-xs text-gray-400">Save full backup file</p></div>
                </button>
                <label class="w-full text-left p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition cursor-pointer">
                    <div class="p-2 bg-purple-100 text-purple-600 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg></div>
                    <div><p class="font-medium">Restore Data</p><p class="text-xs text-gray-400">Upload a previous JSON backup</p></div>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
            </div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button onclick="openModal()" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-brand-light dark:bg-brand-dark text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform z-10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 flex justify-around p-3 pb-safe fixed bottom-0 w-full z-0">
        <button onclick="switchTab('records')" class="nav-btn active flex flex-col items-center text-brand-light dark:text-brand-dark">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            <span class="text-[10px] mt-1">Records</span>
        </button>
        <button onclick="switchTab('chart')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-light dark:hover:text-brand-dark transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
            <span class="text-[10px] mt-1">Chart</span>
        </button>
        <button onclick="switchTab('reports')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-light dark:hover:text-brand-dark transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-[10px] mt-1">Reports</span>
        </button>
    </nav>

    <!-- Add Transaction Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end justify-center">
        <div class="bg-white dark:bg-gray-800 w-full rounded-t-3xl p-5 transform transition-transform translate-y-full max-h-[90vh] overflow-y-auto" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Add Record</h3>
                <button onclick="closeModal()" class="p-1 bg-gray-100 dark:bg-gray-700 rounded-full"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex gap-2 mb-4 bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                <button onclick="setTxType('expense')" id="btnTypeExpense" class="flex-1 py-1.5 rounded bg-danger-light text-white shadow-sm text-sm font-medium">Spendings</button>
                <button onclick="setTxType('income')" id="btnTypeIncome" class="flex-1 py-1.5 rounded text-gray-500 dark:text-gray-400 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-600">Initial</button>
            </div>

            <form id="txForm" onsubmit="saveTransaction(event)">
                <div class="mb-4 flex gap-3">
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 mb-1 block">Currency</label>
                        <select id="modalCurrency" class="w-full text-xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="SAR">SAR (ر.س)</option>
                            <option value="INR">INR (₹)</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 mb-1 block">Date</label>
                        <input type="date" id="txDate" required class="w-full text-base font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-gray-800 dark:text-white">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-500 mb-1 block">Amount</label>
                    <input type="number" id="txAmount" required step="0.01" placeholder="0.00" class="w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-danger-light">
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-500 mb-2 block">Category</label>
                    <div id="categoryGrid" class="grid grid-cols-4 gap-3"></div>
                </div>

                <div class="mb-6">
                    <label class="text-xs text-gray-500 mb-1 block">Note (Optional)</label>
                    <input type="text" id="txNote" placeholder="What was this for?" class="w-full bg-gray-50 dark:bg-gray-700 p-3 rounded-lg outline-none text-sm border border-gray-200 dark:border-gray-600">
                </div>

                <input type="hidden" id="txCategory" required>
                <button id="saveBtn" type="submit" class="w-full bg-danger-light text-white font-bold py-3 rounded-xl">Save</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-sm">
        Notification
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('moneyTrackerTx')) || [];
        let currentType = 'expense';
        let currentCurrency = localStorage.getItem('selectedCurrency') || 'USD';
        let filterMode = localStorage.getItem('dateFilterMode') || 'all';
        let myChart = null;
        let myTrendChart = null;

        const currencySymbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'SAR': 'ر.س', 'INR': '₹' };
        
        const expenseCategories = [
            { id: 'food', icon: '🍔', name: 'Food' },
            { id: 'shop', icon: '🛍️', name: 'Shopping' },
            { id: 'transport', icon: '🚗', name: 'Transport' },
            { id: 'home', icon: '🏠', name: 'Home' },
            { id: 'bills', icon: '📱', name: 'Bills' },
            { id: 'entertainment', icon: '🎬', name: 'Fun' },
            { id: 'health', icon: '⚕️', name: 'Health' },
            { id: 'other', icon: '📦', name: 'Other' }
        ];

        const incomeCategories = [
            { id: 'salary', icon: '💰', name: 'Salary' },
            { id: 'freelance', icon: '💻', name: 'Freelance' },
            { id: 'gift', icon: '🎁', name: 'Gift' },
            { id: 'invest', icon: '📈', name: 'Returns' }
        ];

        // Init Setup
        document.getElementById('currencySelector').value = currentCurrency;
        document.getElementById('dateFilter').value = filterMode;
        if(filterMode === 'custom') document.getElementById('customDateContainer').classList.remove('hidden');

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('sunIcon').classList.remove('hidden');
            document.getElementById('moonIcon').classList.add('hidden');
        }

        // Event Listeners
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('sunIcon').classList.toggle('hidden');
            document.getElementById('moonIcon').classList.toggle('hidden');
            if (myChart) updateUI();
        });

        document.getElementById('currencySelector').addEventListener('change', (e) => {
            currentCurrency = e.target.value;
            localStorage.setItem('selectedCurrency', currentCurrency);
            updateUI();
        });

        document.getElementById('dateFilter').addEventListener('change', (e) => {
            filterMode = e.target.value;
            localStorage.setItem('dateFilterMode', filterMode);
            const customContainer = document.getElementById('customDateContainer');
            if (filterMode === 'custom') { customContainer.classList.remove('hidden'); } 
            else { customContainer.classList.add('hidden'); updateUI(); }
        });

        document.getElementById('filterStartDate').addEventListener('change', updateUI);
        document.getElementById('filterEndDate').addEventListener('change', updateUI);
        document.getElementById('searchTx').addEventListener('input', updateUI);

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
        };

        // Filter Logic
        function getFilteredTransactions() {
            const now = new Date();
            now.setHours(23, 59, 59, 999);
            const searchVal = document.getElementById('searchTx').value.toLowerCase();
            
            return transactions.filter(t => {
                if (t.currency !== currentCurrency) return false;

                const txDateStr = t.date || new Date(t.id).toISOString().split('T')[0];
                const txDate = new Date(txDateStr);
                txDate.setHours(0, 0, 0, 0);

                if (filterMode === 'week') {
                    const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7); weekAgo.setHours(0,0,0,0);
                    if (txDate < weekAgo || txDate > now) return false;
                } else if (filterMode === 'month') {
                    const monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30); monthAgo.setHours(0,0,0,0);
                    if (txDate < monthAgo || txDate > now) return false;
                } else if (filterMode === 'year') {
                    const yearAgo = new Date(now); yearAgo.setFullYear(now.getFullYear() - 1); yearAgo.setHours(0,0,0,0);
                    if (txDate < yearAgo || txDate > now) return false;
                } else if (filterMode === 'custom') {
                    const startStr = document.getElementById('filterStartDate').value;
                    const endStr = document.getElementById('filterEndDate').value;
                    if (startStr && txDate < new Date(startStr + "T00:00:00")) return false;
                    if (endStr && txDate > new Date(endStr + "T23:59:59")) return false;
                }

                if (searchVal) {
                    const catName = [...expenseCategories, ...incomeCategories].find(c => c.id === t.category)?.name.toLowerCase() || '';
                    const note = (t.note || '').toLowerCase();
                    if (!catName.includes(searchVal) && !note.includes(searchVal)) return false;
                }
                
                return true;
            });
        }

        function updateUI() {
            const filteredTx = getFilteredTransactions();
            
            let expenses = 0, income = 0;
            filteredTx.forEach(t => {
                if (t.type === 'expense') expenses += t.amount;
                else income += t.amount;
            });

            const sym = currencySymbols[currentCurrency];
            document.getElementById('totalExpense').innerText = `${sym}${formatMoney(expenses)}`;
            document.getElementById('totalIncome').innerText = `${sym}${formatMoney(income)}`;
            document.getElementById('totalBalance').innerText = `${sym}${formatMoney(income - expenses)}`;

            renderTransactionList(filteredTx, sym);
            updateChart(filteredTx, sym);
        }

        function renderTransactionList(filteredTx, sym) {
            const list = document.getElementById('transactionList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (filteredTx.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredTx.sort((a, b) => {
                    const dateA = new Date(a.date || new Date(a.id).toISOString().split('T')[0]).getTime();
                    const dateB = new Date(b.date || new Date(b.id).toISOString().split('T')[0]).getTime();
                    if (dateB !== dateA) return dateB - dateA;
                    return b.id - a.id;
                }).forEach(tx => {
                    const allCats = [...expenseCategories, ...incomeCategories];
                    const cat = allCats.find(c => c.id === tx.category) || { icon: '📝', name: 'Unknown' };
                    const isExp = tx.type === 'expense';
                    
                    const dateVal = tx.date || new Date(tx.id).toISOString().split('T')[0];
                    const displayDate = new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const noteHtml = tx.note ? `<p class="text-xs text-gray-400 truncate max-w-[150px]">${tx.note}</p>` : '';

                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border-l-4 ${isExp ? 'border-danger-light' : 'border-brand-light'}">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gray-50 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl">${cat.icon}</div>
                                <div>
                                    <p class="font-medium text-sm">${cat.name}</p>
                                    <div class="flex items-center gap-2">
                                        <p class="text-xs text-gray-400">${displayDate}</p>
                                        ${noteHtml}
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-bold ${isExp ? 'text-danger-light dark:text-danger-dark' : 'text-brand-light dark:text-brand-dark'}">
                                    ${isExp ? '-' : '+'}${sym}${formatMoney(tx.amount)}
                                </p>
                                <button onclick="deleteTx(${tx.id})" class="text-xs text-gray-400 hover:text-danger-light mt-1">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function updateChart(filteredTx, sym) {
            const expenseTx = filteredTx.filter(t => t.type === 'expense');
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#9ca3af' : '#6b7280';
            const gridColor = isDark ? '#374151' : '#f3f4f6';

            // Donut Chart Data
            let catData = {};
            // Line Chart Data
            let dateData = {};

            expenseTx.forEach(t => {
                const catName = expenseCategories.find(c => c.id === t.category)?.name || 'Other';
                catData[catName] = (catData[catName] || 0) + t.amount;

                const d = t.date || new Date(t.id).toISOString().split('T')[0];
                dateData[d] = (dateData[d] || 0) + t.amount;
            });

            // Update Donut Chart & Progress Bars
            const ctxDonut = document.getElementById('expenseChart').getContext('2d');
            const labelsDonut = Object.keys(catData);
            const valuesDonut = Object.values(catData);
            const totalDonut = valuesDonut.reduce((a, b) => a + b, 0);

            const listDiv = document.getElementById('topExpensesList');
            listDiv.innerHTML = '';
            let sortedData = Object.entries(catData).sort((a,b) => b[1] - a[1]);
            
            if(sortedData.length === 0) listDiv.innerHTML = '<p class="text-sm text-gray-400 text-center">No spendings in this period.</p>';

            sortedData.forEach(([name, amount]) => {
                const percent = ((amount / totalDonut) * 100).toFixed(1);
                listDiv.innerHTML += `
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-medium">${name}</span>
                            <span class="text-gray-500">${percent}% • ${sym}${formatMoney(amount)}</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-1.5">
                            <div class="bg-danger-light h-1.5 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });

            if (myChart) myChart.destroy();
            myChart = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: labelsDonut,
                    datasets: [{
                        data: valuesDonut,
                        backgroundColor: ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899'],
                        borderWidth: isDark ? 2 : 0,
                        borderColor: isDark ? '#1f2937' : '#ffffff'
                    }]
                },
                options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'right', labels: { color: textColor, font: { size: 11 } } } } }
            });

            // Update Trend Line Chart
            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            const sortedDates = Object.keys(dateData).sort();
            const labelsTrend = sortedDates.map(d => new Date(d).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}));
            const valuesTrend = sortedDates.map(d => dateData[d]);

            if (myTrendChart) myTrendChart.destroy();
            myTrendChart = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: labelsTrend,
                    datasets: [{
                        label: 'Spendings',
                        data: valuesTrend,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ef4444',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
                    }
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId + 'View').classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-light', 'dark:text-brand-dark');
                btn.classList.add('text-gray-400');
            });
            event.currentTarget.classList.remove('text-gray-400');
            event.currentTarget.classList.add('text-brand-light', 'dark:text-brand-dark');

            if(tabId === 'chart') updateUI();
        }

        function openModal() {
            document.getElementById('addModal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modalContent').classList.remove('translate-y-full'); }, 10);
            
            document.getElementById('modalCurrency').value = currentCurrency;
            
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('txDate').value = `${yyyy}-${mm}-${dd}`;
            
            setTxType('expense');
            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
        }

        function closeModal() {
            document.getElementById('modalContent').classList.add('translate-y-full');
            setTimeout(() => { document.getElementById('addModal').classList.add('hidden'); }, 300);
        }

        function setTxType(type) {
            currentType = type;
            const btnExp = document.getElementById('btnTypeExpense');
            const btnInc = document.getElementById('btnTypeIncome');
            const saveBtn = document.getElementById('saveBtn');
            const txAmount = document.getElementById('txAmount');
            
            if (type === 'expense') {
                btnExp.className = 'flex-1 py-1.5 rounded bg-danger-light text-white shadow-sm text-sm font-medium';
                btnInc.className = 'flex-1 py-1.5 rounded text-gray-500 dark:text-gray-400 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-600';
                saveBtn.className = 'w-full bg-danger-light hover:bg-danger-dark text-white font-bold py-3 rounded-xl transition';
                txAmount.className = 'w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-danger-light';
                renderCategories(expenseCategories);
            } else {
                btnInc.className = 'flex-1 py-1.5 rounded bg-brand-light text-white shadow-sm text-sm font-medium';
                btnExp.className = 'flex-1 py-1.5 rounded text-gray-500 dark:text-gray-400 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-600';
                saveBtn.className = 'w-full bg-brand-light hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition';
                txAmount.className = 'w-full text-4xl font-bold bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 pb-2 text-brand-light';
                renderCategories(incomeCategories);
            }
        }

        function renderCategories(cats) {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = cats.map(c => `
                <div onclick="selectCategory('${c.id}', this)" class="cat-item flex flex-col items-center gap-1 p-2 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <div class="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl">${c.icon}</div>
                    <span class="text-[10px] text-gray-500">${c.name}</span>
                </div>
            `).join('');
            document.getElementById('txCategory').value = '';
        }

        function selectCategory(id, el) {
            const activeColor = currentType === 'expense' ? 'bg-danger-light' : 'bg-brand-light';
            const ringColor = currentType === 'expense' ? 'ring-danger-light' : 'ring-brand-light';

            document.querySelectorAll('.cat-item div').forEach(d => {
                d.className = 'w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-xl';
            });
            const iconDiv = el.querySelector('div');
            iconDiv.className = `w-10 h-10 ${activeColor} text-white rounded-full flex items-center justify-center text-xl ring-2 ${ringColor} ring-offset-2 dark:ring-offset-gray-800`;
            document.getElementById('txCategory').value = id;
        }

        function saveTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;
            const modalCurr = document.getElementById('modalCurrency').value;
            const txDate = document.getElementById('txDate').value;
            const note = document.getElementById('txNote').value.trim();

            if (!amount || !category || !txDate) {
                showToast("Please complete all required fields");
                return;
            }

            const tx = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                currency: modalCurr,
                date: txDate,
                note: note
            };

            transactions.push(tx);
            localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
            
            if(modalCurr !== currentCurrency) {
                document.getElementById('currencySelector').value = modalCurr;
                currentCurrency = modalCurr;
                localStorage.setItem('selectedCurrency', modalCurr);
                showToast(`Saved & switched to ${modalCurr} wallet`);
            } else {
                showToast("Record saved!");
            }

            closeModal();
            updateUI();
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
            updateUI();
            showToast("Record deleted");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 2500);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `MoneyTracker_Backup_${new Date().toLocaleDateString()}.json`);
            dlAnchorElem.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        transactions = imported;
                        localStorage.setItem('moneyTrackerTx', JSON.stringify(transactions));
                        updateUI();
                        showToast("Data restored successfully!");
                    }
                } catch (error) {
                    showToast("Error: Invalid backup file");
                }
            };
            reader.readAsText(file);
        }

        function exportCSV() {
            if (transactions.length === 0) {
                showToast("No data to export");
                return;
            }
            const headers = ['Date', 'Type', 'Amount', 'Currency', 'Category', 'Note'];
            const rows = transactions.map(t => {
                const dateVal = t.date || new Date(t.id).toISOString().split('T')[0];
                const catName = [...expenseCategories, ...incomeCategories].find(c => c.id === t.category)?.name || 'Unknown';
                const safeNote = t.note ? `"${t.note.replace(/"/g, '""')}"` : '';
                return `${dateVal},${t.type},${t.amount},${t.currency},${catName},${safeNote}`;
            });
            
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `MoneyTracker_Export_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        updateUI();
    </script>
</body>
</html>
